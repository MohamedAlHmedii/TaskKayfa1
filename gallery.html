<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
</head>
<body>

<img src="phot1.png"
     alt="منظر جبلي"
     width="400"
     height="250">

<img src="photo2.jpg"
     alt="شاطئ وقت الغروب"
     width="400"
     height="250">

<figure>
    <img src="photo3.jpg"
         alt="أفق مدينة حديثة"
         width="400"
         height="250">

    <figcaption>منظر لمدينة حديثة ليلاً</figcaption>
</figure>

<!-- صورة ديكورية لا تضيف أي معلومات للمحتوى، لذلك يكون alt فارغًا -->
<img src="pattern.svg"
     alt=""
     width="200"
     height="100">

<img src="small.jpg"
     srcset="small.jpg 600w,
             larg.jpg 1200w"
     alt="امن ملعومات"
     width="600"
     height="400">

<video controls poster="poster.png" width="600">
    <source src="vid1.mp4" type="video/mp4">
    متصفحك لا يدعم تشغيل الفيديو.
</video>

</body>
</html>
